# Builds the jar(s) and publishes them as a GitHub release.
# Run from the Actions tab: Release -> Run workflow (the tag defaults to mod_version).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = mod_version from gradle.properties)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          mkdir dist
          ./gradlew build --stacktrace
          ./gradlew -p mc1.21.11 build --stacktrace
          cp build/libs/*.jar mc1.21.11/build/libs/*.jar dist/ && rm -f dist/*-sources.jar
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cat > notes.md <<'NOTES'
          Tiny armor durability bars above the hotbar, a stripped-down version of [microDurability](https://modrinth.com/mod/microdurability) by pajic: armor bars only, no low-durability warning.

          - **New:** Minecraft **1.21.11** support (separate jar).

          | File | Minecraft |
          |---|---|
          | `microdurability-armor-bars-*.jar` | 26.1.2, 26.2, 26.3 |
          | `microdurability-armor-bars-*+mc1.21.11.jar` | 1.21.11 |

          Requires Fabric API. Client-side only. MIT license.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "microDurability Armor Bars $TAG" --notes-file notes.md
